
# ==========================================
# EVENTRIX - CONFIGURACIÓN DE SPRING BOOT
# ==========================================

spring.application.name=eventrix-api

# ==========================================
# BASE DE DATOS - MYSQL 9.7
# ==========================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eventrix}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Validar las tablas existentes sin modificarlas
spring.jpa.hibernate.ddl-auto=validate

# Mostrar consultas SQL durante el desarrollo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# AUTENTICACIÓN JWT
# ==========================================

# Duración del token: 60 minutos
jwt.expiration=3600000

# Clave secreta obtenida de una variable de entorno
jwt.secret=${JWT_SECRET}
