spring.application.name=eventrix-api

spring.datasource.url=jdbc:mysql://localhost:3306/eventrix
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mongodb.uri=${MONGO_URI:mongodb://127.0.0.1:27017/eventrix_analytics}
spring.mongodb.database=${MONGO_DB:eventrix_analytics}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
